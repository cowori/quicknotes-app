<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture your ideas before they disappear.</p>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>

            <form id="note-form">
                <div class="form-group note-text-group">
                    <label for="note-input">Note</label>
                    <input
                        type="text"
                        id="note-input"
                        name="note"
                        maxlength="201"
                        placeholder="Type your note"
                    >
                </div>

                <div class="form-group">
                    <label for="note-category">Category</label>
                    <select id="note-category" name="category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" aria-live="polite"></p>
        </section>

        <section>
            <div class="notes-heading">
                <h2>Your notes</h2>
                <button type="button" id="clear-all-btn">Clear all</button>
            </div>

            <label for="search-input">Search notes</label>
            <input
                type="search"
                id="search-input"
                placeholder="Search your notes"
            >

            <p id="note-count" aria-live="polite">
                You have no notes yet.
            </p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes</p>
    </footer>
</body>
</html>
